[package]
name = "gif_optimizer"
version = "0.1.0"
edition = "2021"
description = "Losslessly removes redundant frames from GIFs in the executable's directory"

[dependencies]
anyhow = "1"
gif = "0.14"
ratatui = "0.30.2"

[dev-dependencies]
weezl = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
